<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/game-page-styles.css" />
    <title>BlackJack</title>
  </head>
  <body>
    <div class="casino">
      <!-- Table: wooden rim + felt (Nihar) -->
      <div class="table-rim">
        <div class="table-container">
          <!-- dealer position (top center: made by Nihar) -->
          <div id="dealer-spot" class="seat">
            <div id="dealer-cards" class="cards-container">
              <img id="hidden" src="./images/BACK.png" />
            </div>
            <div id="dealer-score" class="score-badge">0</div>
          </div>

          <!-- player position (bottom center: Made by Nihar) -->
          <div id="player-spot" class="seat">
            <div id="your-cards" class="cards-container"></div>
          </div>
        </div>
        <!--Wojtek start-->
        <div id="name-and-score">
          <div id="player-name"></div>
          <div id="player-score" class="score-badge">0</div>
        </div>
        <div class="hit-stay-btn-container">
          <button class="hit-stay-buttons" id="hit">Hit</button>
          <button class="hit-stay-buttons" id="stay">Stay</button>
        </div>
        <!--Wojtek end-->
      </div>
      <!--Bogdan start-->
      <div class="blackjack-bet-window">
        <div class="bj-stats-bar">
          <div class="bj-balance-box">
            Bankroll: <span id="bj-balance">$1000</span>
          </div>
          <div id="bj-bet-error" class="bj-error-msg"></div>
        </div>

        <div class="bj-total-bet-display" id="bj-bet-display">Bet: $0</div>

        <div class="bj-chips-container" id="bj-chips-row">
          <button class="bj-chip bj-chip-1" data-value="1">$1</button>
          <button class="bj-chip bj-chip-5" data-value="5">$5</button>
          <button class="bj-chip bj-chip-25" data-value="25">$25</button>
          <button class="bj-chip bj-chip-100" data-value="100">$100</button>
          <button class="bj-chip bj-chip-500" data-value="500">$500</button>
        </div>

        <div class="bj-action-controls">
          <button class="bj-btn bj-btn-clear" id="bj-clear-btn">
            Clear Bet
          </button>
          <button class="bj-btn bj-btn-deal" id="bj-deal-btn">Deal Hand</button>
        </div>
      </div>
      <div id="results"></div>
      <!--Bogdan end-->
    </div>
    <script src="Javascript js/script.js"></script>
  </body>
</html>
